<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<script src="./lucide-icon.js"></script>
</helmet>
<div style="width:100%;height:100%;display:flex;background:var(--bg);color:var(--fg);font-family:Geist,system-ui,sans-serif;font-size:13px;overflow:hidden">
  <dc-import name="Sidebar" active="inbox" space="thmp" dark="{{ dark }}" hint-size="240px,100%"></dc-import>
  <main style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header style="height:48px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:8px">
      <l-i n="panel-left" s="16" style="color:var(--mfg)"></l-i>
      <div style="width:1px;height:16px;background:var(--border);margin:0 6px"></div>
      <span style="color:var(--mfg)">THMP</span><l-i n="chevron-right" s="14" style="color:var(--faint)"></l-i><span style="font-weight:500">Inbox</span>
      <div style="flex:1"></div>
      <span style="display:flex;align-items:center;gap:6px;color:var(--faint);font-size:12px"><span style="font-family:Geist Mono,monospace;border:1px solid var(--border);border-radius:4px;padding:0 5px">J</span><span style="font-family:Geist Mono,monospace;border:1px solid var(--border);border-radius:4px;padding:0 5px">K</span>to move</span>
    </header>
    <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;overflow:hidden;padding:36px 40px">
        <div style="max-width:760px;margin:0 auto">
          <div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:26px;font-weight:600;letter-spacing:-0.025em">Inbox</span><span style="font-family:Geist Mono,monospace;font-size:13px;color:var(--faint)">4 to triage</span></div>
          <div style="color:var(--mfg);margin-top:6px">Everything from Quick capture lands here. Decide what each thing is, then move on.</div>
          <div style="margin-top:24px;display:flex;flex-direction:column;gap:6px">
            <sc-for list="{{ items }}" as="i" hint-placeholder-count="4">
              <div style="border-radius:10px;border:1px solid {{ i.bd }};background:{{ i.bg }};padding:14px 16px;box-shadow:{{ i.sh }}">
                <div style="display:flex;gap:12px;align-items:flex-start">
                  <l-i n="{{ i.icon }}" s="15" style="color:var(--faint);margin-top:2px"></l-i>
                  <div style="flex:1;min-width:0"><div style="font-size:14px;line-height:1.5;text-wrap:pretty">{{ i.t }}</div><div style="font-family:Geist Mono,monospace;font-size:11.5px;color:var(--faint);margin-top:4px">{{ i.when }}</div></div>
                </div>
                <sc-if value="{{ i.active }}">
                  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-left:27px">
                    <sc-for list="{{ actions }}" as="a" hint-placeholder-count="6">
                      <div style="height:28px;padding:0 8px 0 10px;border-radius:7px;border:1px solid var(--border);background:{{ a.bg }};color:{{ a.fg }};display:flex;align-items:center;gap:7px;white-space:nowrap"><l-i n="{{ a.icon }}" s="13"></l-i>{{ a.l }}<span style="font-family:Geist Mono,monospace;font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 4px;min-width:8px;text-align:center">{{ a.k }}</span></div>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;max-width:340px">
          <div style="width:56px;height:56px;border-radius:28px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 0 0 8px var(--accent-soft)"><l-i n="check" s="24" w="2.25"></l-i></div>
          <div style="font-size:18px;font-weight:600;letter-spacing:-0.015em">Inbox zero</div>
          <div style="color:var(--mfg);line-height:1.5">You triaged 6 things today. Your head is clear.</div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:14px;color:var(--faint);font-size:12px">Capture something with<span style="font-family:Geist Mono,monospace;border:1px solid var(--border);border-radius:4px;padding:0 5px">⌘J</span></div>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;populated&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;populated&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === 'true';
    const empty = this.props.state === 'empty';
    const it = (t, when, icon, active) => ({ t, when, icon, active, bd: active ? 'var(--border2)' : 'transparent', bg: active ? 'var(--card)' : 'transparent', sh: active ? '0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)' : 'none' });
    return {
      dark, empty, full: !empty,
      items: [
        it('Storefront category page jumps when images load — reserve aspect ratio before lazy-load lands', 'Today 09:42 · Quick capture', 'lightbulb', true),
        it('Ask Priya if the admin role contract can ship as v0 without permissions matrix', 'Today 09:10', 'message-square', false),
        it('Look into React Query v5 suspense for the vendor portal list pages', 'Yesterday 18:05', 'bookmark', false),
        it('Tech talk idea: “URL is state” — pagination, filters, tabs', 'Mon 22 Sep', 'lightbulb', false)
      ],
      actions: [['square-check-big', 'Task', 'T'], ['list-todo', 'Todo', 'D'], ['file-text', 'Note', 'N'], ['calendar-plus', 'Event', 'E'], ['arrow-right-left', 'Move to space', 'M'], ['trash-2', 'Discard', '⌫']].map(([icon, l, k], i) => ({ icon, l, k, bg: i === 0 ? 'var(--hover)' : 'transparent', fg: i === 5 ? 'var(--destr)' : 'var(--fg)' }))
    };
  }
}
</script>
</body>
</html>
