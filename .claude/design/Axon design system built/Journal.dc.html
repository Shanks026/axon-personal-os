<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<script src="./lucide-icon.js"></script>
</helmet>
<div style="width:100%;height:100%;display:flex;background:var(--bg);color:var(--fg);font-family:Geist,system-ui,sans-serif;font-size:13px;overflow:hidden">
  <dc-import name="Sidebar" active="journal" space="thmp" dark="{{ dark }}" hint-size="240px,100%"></dc-import>
  <main style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header style="height:48px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:8px">
      <l-i n="panel-left" s="16" style="color:var(--mfg)"></l-i>
      <div style="width:1px;height:16px;background:var(--border);margin:0 6px"></div>
      <span style="color:var(--mfg)">THMP</span><l-i n="chevron-right" s="14" style="color:var(--faint)"></l-i><span style="font-weight:500">Journal</span>
      <div style="flex:1"></div>
      <div style="height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--border);display:flex;align-items:center;gap:6px;color:var(--mfg)"><l-i n="calendar" s="14"></l-i>Sep 2026</div>
    </header>
    <div style="border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:8px">
      <div style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--mfg)"><l-i n="chevron-left" s="16"></l-i></div>
      <div style="flex:1;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px">
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="14">
          <div style="height:56px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:{{ d.bg }};color:{{ d.fg }};border:1px solid {{ d.bd }}">
            <span style="font-size:10.5px;color:{{ d.wc }}">{{ d.w }}</span>
            <span style="font-size:15px;font-weight:{{ d.fw }};font-variant-numeric:tabular-nums">{{ d.n }}</span>
            <span style="width:4px;height:4px;border-radius:2px;background:{{ d.dot }}"></span>
          </div>
        </sc-for>
      </div>
      <div style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--mfg)"><l-i n="chevron-right" s="16"></l-i></div>
    </div>
    <div style="flex:1;min-height:0;display:flex;overflow:hidden">
      <div style="flex:1;min-width:0;padding:40px 56px">
        <div style="max-width:660px;margin:0 auto">
          <div style="display:flex;align-items:baseline;gap:12px"><div style="font-size:30px;font-weight:600;letter-spacing:-0.03em">Tuesday, 23 September</div><span style="font-family:Geist Mono,monospace;font-size:12px;color:var(--faint)">Q2 · W13</span></div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--mfg)"><l-i n="layout-template" s="13"></l-i>Standup template<span style="color:var(--faint)">·</span><span style="display:flex;align-items:center;gap:5px;color:var(--faint)"><l-i n="check" s="13"></l-i>Saved</span></div>
          <div style="display:flex;flex-direction:column;gap:26px;margin-top:32px">
            <sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
              <div>
                <div style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:{{ s.hc }}">{{ s.h }}</div>
                <div style="font-size:15px;line-height:1.7;margin-top:6px;color:{{ s.fg }};display:flex;gap:10px"><span style="color:var(--faint)">{{ s.bullet }}</span><span>{{ s.t }}</span></div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
      <aside style="width:300px;flex-shrink:0;border-left:1px solid var(--border);padding:24px 20px;display:flex;flex-direction:column;gap:18px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;font-weight:600"><l-i n="circle-check" s="14" style="color:var(--ok)"></l-i>Done today</div>
          <div style="color:var(--mfg);font-size:12px;margin-top:3px">Auto-listed for reference</div>
          <div style="display:flex;flex-direction:column;margin-top:10px">
            <sc-for list="{{ done }}" as="d" hint-placeholder-count="3">
              <div style="min-height:34px;display:flex;align-items:center;gap:8px"><l-i n="{{ d.icon }}" s="14" style="color:{{ d.c }}"></l-i><span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ d.t }}</span><span style="font-family:Geist Mono,monospace;font-size:11px;color:var(--faint)">{{ d.time }}</span></div>
            </sc-for>
          </div>
        </div>
        <div style="height:34px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mfg)"><l-i n="corner-down-left" s="13"></l-i>Insert into “Today”</div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === 'true';
    const wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const has = [15, 16, 17, 18, 19, 22, 23];
    const days = [];
    for (let i = 0; i < 14; i++) {
      const n = 15 + i, today = n === 23, future = n > 23;
      days.push({ n: String(n), w: wd[i % 7], bg: today ? 'var(--card)' : 'transparent', bd: today ? 'var(--border2)' : 'transparent', fg: future ? 'var(--faint)' : 'var(--fg)', wc: today ? 'var(--accent)' : 'var(--faint)', fw: today ? 600 : 400, dot: has.includes(n) ? (today ? 'var(--accent)' : 'var(--border2)') : 'transparent' });
    }
    return {
      dark, days,
      sections: [
        { h: 'Yesterday', t: 'Finished the KYC upload UI — progress per file, retry on failure.', hc: 'var(--mfg)', fg: 'var(--fg)', bullet: '–' },
        { h: 'Today', t: 'RFQ pagination review fixes: memoise filter hash, add regression test.', hc: 'var(--mfg)', fg: 'var(--fg)', bullet: '–' },
        { h: 'Blockers', t: 'Admin API contract for role-based menus.', hc: 'var(--destr)', fg: 'var(--fg)', bullet: '–' },
        { h: 'Notes', t: 'Type here…', hc: 'var(--mfg)', fg: 'var(--faint)', bullet: '' }
      ],
      done: [
        { icon: 'circle-check', c: 'var(--ok)', t: 'Rebase MR !1428 on develop', time: '11:20' },
        { icon: 'circle-ellipsis', c: 'var(--review)', t: 'RFQ pagination → In review', time: '14:05' }
      ]
    };
  }
}
</script>
</body>
</html>
